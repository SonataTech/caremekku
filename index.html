<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareMe KKU - แพลตฟอร์มความปลอดภัย มข.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kkunavy: '#173B67',
            kkublue: '#3B82F6',
            kkubg: '#EAF4FF',
            sosRed: '#EF4444',
            successGreen: '#22C55E'
          },
          fontFamily: { sans: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #EAF4FF; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pulse-glow { animation: pulse-glow 1.5s infinite; }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    #fullMap { height: 300px; width: 100%; border-radius: 1rem; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-200 p-0 sm:p-4">
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 border-slate-800">

    <!-- TOP HEADER -->
    <header class="bg-gradient-to-b from-kkunavy to-[#1e487d] text-white px-5 pt-6 pb-4 rounded-b-[24px] shadow-md z-10">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-md">
            <i class="fa-solid fa-shield-heart text-sky-300 text-lg"></i>
          </div>
          <span class="font-bold text-lg tracking-wide text-white">CareMe KKU</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="toggleNetSim()" id="networkBadge" class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2.5 py-1 rounded-full font-medium transition flex items-center space-x-1 hover:bg-emerald-500/30">
            <span id="netDot">🟢</span> <span id="netStatusText">ออนไลน์</span>
          </button>
        </div>
      </div>
      <div>
        <p class="text-[11px] text-sky-200" id="headerSubTitle">ดูแลคุณ ทุกที่ใน KKU</p>
        <h2 class="text-base font-bold mt-0.5 text-white" id="headerTitle">สวัสดี 👋 วันนี้คุณปลอดภัยดีไหม?</h2>
      </div>
    </header>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main class="flex-1 overflow-y-auto px-5 py-4 space-y-4 no-scrollbar pb-24">

      <!-- OFFLINE QUEUE STATUS BANNER -->
      <div id="offlineQueueBanner" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-3 text-xs text-amber-800 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-wifi text-amber-600 animate-pulse"></i>
          <span>กำลังทำงานในโหมดออฟไลน์</span>
        </div>
      </div>

      <!-- MAP SECTION -->
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-red-500"></i> ตำแหน่งปัจจุบันของคุณ
          </h3>
        </div>
        <div id="fullMap" class="z-0"></div>
      </div>

      <!-- PHOTO CAPTURE & INCIDENT REPORT SECTION -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-camera text-kkunavy"></i> ถ่ายภาพแจ้งเหตุ / ภาพประกอบ
        </h3>

        <!-- Hidden File Input targeting Mobile Camera -->
        <input 
          type="file" 
          id="cameraInput" 
          accept="image/*" 
          capture="environment" 
          class="hidden" 
          onchange="previewCapturedImage(event)" 
        />

        <!-- Camera Trigger Button -->
        <button 
          type="button" 
          onclick="triggerCamera()" 
          class="w-full py-3 px-4 bg-kkunavy hover:bg-slate-800 active:scale-95 text-white font-medium rounded-xl flex items-center justify-center gap-2 shadow-sm transition-all duration-200"
        >
          <i class="fa-solid fa-camera text-lg"></i>
          <span>กดเพื่อถ่ายรูป / เลือกรูปภาพ</span>
        </button>

        <!-- Image Preview Container -->
        <div id="previewCard" class="hidden relative rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
          <img id="imagePreview" src="" alt="ภาพถ่ายของคุณ" class="w-full h-48 object-cover rounded-xl" />
          <button 
            type="button" 
            onclick="removeCapturedImage()" 
            class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-700 active:scale-90 transition"
            title="ลบรูปภาพ"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="p-2 text-center bg-emerald-50 text-emerald-700 text-xs font-medium border-t border-emerald-100">
            ✓ แนบรูปภาพเรียบร้อยแล้ว
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Initialize Leaflet Map
    document.addEventListener("DOMContentLoaded", function () {
      if (document.getElementById('fullMap')) {
        var map = L.map('fullMap').setView([16.4746, 102.8227], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([16.4746, 102.8227]).addTo(map)
          .bindPopup('มหาวิทยาลัยขอนแก่น (KKU)')
          .openPopup();
      }
    });

    // Toggle Network Simulation Status
    function toggleNetSim() {
      const netBadge = document.getElementById('networkBadge');
      const netDot = document.getElementById('netDot');
      const netStatusText = document.getElementById('netStatusText');
      const offlineBanner = document.getElementById('offlineQueueBanner');

      if (netStatusText.innerText === 'ออนไลน์') {
        netStatusText.innerText = 'ออฟไลน์';
        netDot.innerText = '🔴';
        netBadge.className = netBadge.className.replace('emerald', 'amber');
        offlineBanner.classList.remove('hidden');
      } else {
        netStatusText.innerText = 'ออนไลน์';
        netDot.innerText = '🟢';
        netBadge.className = netBadge.className.replace('amber', 'emerald');
        offlineBanner.classList.add('hidden');
      }
    }

    // Trigger Camera Function
    function triggerCamera() {
      document.getElementById('cameraInput').click();
    }

    // Preview Captured Image
    function previewCapturedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('previewCard').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // Remove Captured Image
    function removeCapturedImage() {
      document.getElementById('cameraInput').value = '';
      document.getElementById('imagePreview').src = '';
      document.getElementById('previewCard').classList.add('hidden');
    }
  </script>
</body>
</html>
